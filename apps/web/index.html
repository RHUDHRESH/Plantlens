<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlantLens</title>
    <script>
      // Apply the saved theme before first paint (no light/dark flash). Fonts are bundled locally
      // so offline control-room machines render correctly.
      (function () {
        var pref = "system";
        try { pref = localStorage.getItem("plantlens.theme") || "system"; } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
