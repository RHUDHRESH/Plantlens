# Edge profile — gateway on-site; API/web can be local or remote.
# Run from repo root:
#   docker compose -f deploy/docker/compose.edge.yml up --build
#
# FAIL-FAST (required on the plant NUC — do not ship empty / wrong values):
#   API_BASE_URL          — central PlantLens API base URL
#                           (local default: http://host.docker.internal:8000)
#   GATEWAY_INGEST_TOKEN  — must match the API GATEWAY_INGEST_TOKEN exactly
#                           (ingest rejects mismatches; never leave as change-me in prod)
# Export them before `up`, or place them in a root `.env` consumed by Compose.
# Example:
#   set API_BASE_URL=https://plantlens.example
#   set GATEWAY_INGEST_TOKEN=<shared-secret>
#
# On the plant NUC: run gateway (+ optional local ollama).
# Central host: run api + web + postgres from compose.full.yml.
#
# Optional volumes:
#   Mount a host folder for scenario recordings / playback captures if you keep
#   offline demos beside the gateway (example below, commented out).
name: plantlens-edge

services:
  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/gateway.Dockerfile
    environment:
      # Required in production — override these; defaults are local-dev only.
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:8000}
      GATEWAY_INGEST_TOKEN: ${GATEWAY_INGEST_TOKEN:-dev-token}
      MODBUS_HOST: ${MODBUS_HOST:-}
      MODBUS_PORT: ${MODBUS_PORT:-502}
      HEALTH_PORT: "9101"
    ports:
      - "${GATEWAY_HEALTH_HOST_PORT:-9101}:9101"
    # Uncomment for real RS485:
    # devices: ["/dev/ttyUSB0:/dev/ttyUSB0"]
    # Optional recordings/playback mount (host path → container path):
    # volumes:
    #   - ${GATEWAY_RECORDINGS_DIR:-./recordings}:/data/recordings
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/health', timeout=2)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional on-edge LLM for air-gapped explain/draft (never on diagnosis path)
  ollama:
    profiles: ["llm"]
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
    restart: unless-stopped

volumes:
  ollama_data:
