# PlantLens stack. Run from the repo root on the SERVER PC:
#   cp deploy/docker/.env.example deploy/docker/.env      # then edit secrets / ports
#   docker compose -f deploy/docker/compose.full.yml --env-file deploy/docker/.env up -d --build
# Other PCs on the network open  http://<server-ip>:8080  in a browser.
# The gateway (RS-485 / Arduino) can run here (profile "gateway") or on another PC
# (deploy/docker/compose.gateway.yml). See docs/MULTI_PC_SETUP.md.
name: plantlens
services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      PLANTLENS_ENV: ${PLANTLENS_ENV:-dev}
      # SQLite in a named volume: approved revisions + audit ledger survive restarts.
      DATABASE_URL: sqlite+aiosqlite:////data/plantlens.db
      ACTIVE_PLANT_ID: demo_microgrid_001
      PLANTLENS_DEV_JWT_SECRET: ${PLANTLENS_DEV_JWT_SECRET:?set PLANTLENS_DEV_JWT_SECRET in .env}
      GATEWAY_INGEST_TOKEN: ${GATEWAY_INGEST_TOKEN:?set GATEWAY_INGEST_TOKEN in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      AGENTS_BASE_URL: http://agents:8100
    volumes: ["apidata:/data"]
    ports: ["${API_PORT:-8000}:8000"]
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on: [api]
    restart: unless-stopped

  gateway:
    profiles: ["gateway"]   # only when the adapter/Uno is plugged into THIS PC
    build:
      context: ../..
      dockerfile: deploy/docker/gateway.Dockerfile
    environment:
      API_BASE_URL: http://api:8000
      GATEWAY_INGEST_TOKEN: ${GATEWAY_INGEST_TOKEN:?set GATEWAY_INGEST_TOKEN in .env}
      HEALTH_PORT: "9101"
      # modbus (RS-485 adapter) | line (Arduino Uno streaming PL1/CSV over USB)
      GATEWAY_SERIAL_MODE: ${GATEWAY_SERIAL_MODE:-modbus}
      GATEWAY_SERIAL_PORT: /dev/ttyPLANTLENS0
    devices:
      # Host path of the adapter; /dev/serial/by-id/... survives replugging. Set in .env.
      - ${GATEWAY_DEVICE:-/dev/ttyUSB0}:/dev/ttyPLANTLENS0
    ports: ["9101:9101"]
    depends_on: [api]
    restart: unless-stopped

  agents:
    profiles: ["agents"]    # optional draft-only AI service
    build:
      context: ../..
      dockerfile: deploy/docker/agents.Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports: ["8100:8100"]

volumes:
  apidata:
