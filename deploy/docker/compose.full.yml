# Full local stack. Run from repo root:
#   docker compose -f deploy/docker/compose.full.yml up --build
# MVP shortcut: comment out postgres + agents and set api DATABASE_URL to sqlite.
name: plantlens
services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      PLANTLENS_ENV: dev
      DATABASE_URL: postgresql+psycopg://plantlens:plantlens@postgres:5432/plantlens
      ACTIVE_PLANT_ID: demo_microgrid_001
      SAMPLE_DATA_DIR: /packages/sample-data/demo-microgrid
      COMPILED_DIR: /app/compiled
      GATEWAY_INGEST_TOKEN: dev-token
      AGENTS_BASE_URL: http://agents:8100
    ports: ["8000:8000"]
    depends_on: [postgres]

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    ports: ["8080:80"]
    depends_on: [api]

  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/gateway.Dockerfile
    environment:
      API_BASE_URL: http://api:8000
      GATEWAY_INGEST_TOKEN: dev-token
      HEALTH_PORT: "9101"
      # modbus (RS-485 adapter) | line (Arduino Uno streaming PL1/CSV over USB)
      GATEWAY_SERIAL_MODE: ${GATEWAY_SERIAL_MODE:-modbus}
      # Stable in-container path; map the host's /dev/serial/by-id/... link to it below.
      GATEWAY_SERIAL_PORT: ${GATEWAY_SERIAL_PORT:-}
      # Further tuning (GATEWAY_LINK__*, GATEWAY_LINE__*, GATEWAY_MODBUS__*): apps/gateway/README.md
    ports: ["9101:9101"]
    # Real hardware: pass the adapter by its by-id path (survives replug/renumbering), e.g.
    # devices:
    #   - /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0:/dev/ttyPLANTLENS0
    # and set GATEWAY_SERIAL_PORT=/dev/ttyPLANTLENS0. Hotplug inside a container additionally
    # needs the device cgroup rule instead of a fixed mapping, e.g.
    #   device_cgroup_rules: ["c 188:* rmw", "c 166:* rmw"]   # ttyUSB*, ttyACM*
    #   volumes: ["/dev:/dev"]
    depends_on: [api]

  agents:
    build:
      context: ../..
      dockerfile: deploy/docker/agents.Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports: ["8100:8100"]

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: plantlens
      POSTGRES_PASSWORD: plantlens
      POSTGRES_DB: plantlens
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

volumes:
  pgdata:
